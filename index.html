<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Gold Price Update</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Moul&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: var(--tg-theme-bg-color, #f8fafc);
        color: var(--tg-theme-text-color, #1e293b);
      }
      .tma-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
      }
      .input-field {
        background-color: var(--tg-theme-secondary-bg-color, #ffffff);
        border: 1px solid #e2e8f0;
        transition: all 0.2s ease;
      }
      .input-field:focus {
        border-color: #d4af37;
        box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
      }
      .btn-gold {
        background: linear-gradient(
          135deg,
          #d4af37 0%,
          #ffd700 50%,
          #b8860b 100%
        );
        color: #ffffff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
      #capture-area {
        font-family: "Kantumruy Pro", sans-serif;
      }
      #settings-modal,
      #login-modal {
        transition:
          opacity 0.2s ease,
          visibility 0.2s;
      }
      #settings-modal.hidden,
      #login-modal.hidden {
        opacity: 0;
        visibility: hidden;
        display: flex !important;
        pointer-events: none;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin-custom {
        animation: spin 1s linear infinite;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 20px;
      }
      .letter-spacing-comfortable {
        letter-spacing: 2px;
      }
      .adjust-btn {
        background-color: var(--tg-theme-secondary-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #1e293b);
        border: 1px solid #e2e8f0;
        transition: all 0.1s ease;
      }
      .adjust-btn:active {
        transform: scale(0.96);
      }
      .adjust-btn:hover {
        background-color: var(--tg-theme-bg-color, #f8fafc);
        border-color: #d4af37;
      }
    </style>
  </head>
  <body class="antialiased">
    <!-- Client Login Modal -->
    <div
      id="login-modal"
      class="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm"
    >
      <div
        class="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl p-6"
      >
        <h2 class="text-xl font-bold text-slate-800 text-center mb-4">
          Client Login
        </h2>
        <p class="text-sm text-slate-500 text-center mb-6">
          Please enter your authentication token.
        </p>
        <input
          type="text"
          id="client-token"
          class="input-field w-full px-4 py-3 rounded-xl outline-none text-base mb-4"
          placeholder="Your token"
        />
        <button
          id="client-login-btn"
          class="w-full btn-gold py-3 rounded-xl font-bold shadow-lg shadow-yellow-500/20 active:scale-95 transition-transform"
        >
          Login
        </button>
        <p
          id="login-error"
          class="text-red-500 text-sm mt-3 text-center hidden"
        >
          Invalid Token
        </p>
      </div>
    </div>

    <!-- Global Loading Overlay -->
    <div
      id="loading-overlay"
      class="fixed inset-0 z-[100] flex items-center justify-center bg-black/20 backdrop-blur-[2px] hidden"
    >
      <div class="bg-white/90 p-5 rounded-3xl flex flex-col items-center gap-3">
        <svg
          class="animate-spin-custom h-10 w-10 text-yellow-600"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        <span class="text-sm font-bold text-slate-600 uppercase tracking-widest"
          >Processing</span
        >
      </div>
    </div>

    <!-- Template Removed -->
    <!-- Settings Modal -->
    <div
      id="settings-modal"
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm hidden"
    >
      <div
        class="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl"
      >
        <div class="p-6 space-y-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-800">Bot Settings</h2>
            <button
              id="close-settings"
              class="p-2 text-slate-400 hover:text-slate-600"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <div class="space-y-4">
            <div
              class="space-y-1.5 bg-slate-50 p-3 rounded-xl border border-slate-100"
            >
              <label
                class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
                >Current Channel</label
              >
              <div
                id="cfg-channel-name"
                class="font-medium text-slate-800 truncate"
              >
                Unknown
              </div>
            </div>
            <div class="space-y-1.5">
              <label
                class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
                >Buy Margin ($)</label
              >
              <input
                type="number"
                id="cfg-buy-margin"
                class="input-field w-full px-4 py-3 rounded-xl outline-none text-base"
                placeholder="35"
              />
            </div>
            <div class="space-y-1.5">
              <label
                class="text-xs font-semibold text-slate-500 uppercase tracking-wider"
                >Sell Spread ($)</label
              >
              <input
                type="number"
                id="cfg-sell-spread"
                class="input-field w-full px-4 py-3 rounded-xl outline-none text-base"
                placeholder="30"
              />
            </div>
          </div>

          <div class="flex gap-3 pt-2">
            <button
              id="save-settings"
              class="flex-1 btn-gold py-3 rounded-xl font-bold shadow-lg shadow-yellow-500/20 active:scale-95 transition-transform"
            >
              Save Configuration
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="tma-container max-w-md mx-auto">
      <div class="mb-4">
        <h2 class="text-lg font-bold text-slate-800" id="welcome-text">
          Welcome, Client
        </h2>
        <button id="logout-btn" class="text-sm text-red-500 font-medium">
          Logout
        </button>
      </div>

      <!-- Bot Active Toggle -->
      <div class="mb-8">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-xl font-semibold text-slate-800">Bot Status</h2>
            <p class="text-sm text-slate-500 mt-1">
              Enable or disable automatic updates
            </p>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input
              type="checkbox"
              id="bot-active-toggle"
              class="sr-only peer"
            />
            <div
              class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-yellow-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-yellow-500"
            ></div>
          </label>
        </div>
      </div>

      <!-- Push Gold Price -->
      <header class="mb-8 flex justify-between items-start">
        <div>
          <h1 class="text-xl font-semibold tracking-tight">Gold Price</h1>
          <p class="text-sm text-slate-500 mt-1">Update current market rates</p>
        </div>
        <button
          id="open-settings"
          class="p-2 text-slate-400 hover:text-slate-600 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </header>

      <main class="flex-grow space-y-6">
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label
              for="sell-price"
              class="text-xs font-medium text-slate-500 uppercase tracking-wider ml-1"
              >Sell Price</label
            >
            <div class="flex items-stretch gap-2">
              <div class="relative flex-1">
                <input
                  type="number"
                  id="sell-price"
                  placeholder="0.00"
                  step="0.01"
                  inputmode="decimal"
                  class="input-field w-full px-4 py-3.5 rounded-2xl outline-none text-lg font-medium"
                />
                <span
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium"
                  >USD</span
                >
              </div>
              <button
                type="button"
                id="both-plus-5"
                class="adjust-btn w-12 flex flex-col items-center justify-center rounded-2xl outline-none text-xs font-bold gap-0.5"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
                +5
              </button>
            </div>
          </div>
          <div class="space-y-1.5">
            <label
              for="buy-price"
              class="text-xs font-medium text-slate-500 uppercase tracking-wider ml-1"
              >Buy Price</label
            >
            <div class="flex items-stretch gap-2">
              <div class="relative flex-1">
                <input
                  type="number"
                  id="buy-price"
                  placeholder="0.00"
                  step="0.01"
                  inputmode="decimal"
                  class="input-field w-full px-4 py-3.5 rounded-2xl outline-none text-lg font-medium"
                />
                <span
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 font-medium"
                  >USD</span
                >
              </div>
              <button
                type="button"
                id="both-minus-5"
                class="adjust-btn w-12 flex flex-col items-center justify-center rounded-2xl outline-none text-xs font-bold gap-0.5"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                -5
              </button>
            </div>
          </div>
        </div>
      </main>

      <footer class="mt-auto pt-6">
        <button
          id="main-btn"
          class="btn-gold w-full py-4 rounded-2xl font-semibold text-lg active:scale-[0.98] transition-transform duration-100 shadow-lg shadow-yellow-500/20"
        >
          Update Prices
        </button>
      </footer>
    </div>

    <script>
      const tg = window.Telegram.WebApp;
      const API_BASE_URL = window.location.origin;
      tg.expand();
      tg.ready();

      const loadingOverlay = document.getElementById("loading-overlay");
      const loginModal = document.getElementById("login-modal");
      const clientTokenInput = document.getElementById("client-token");
      const clientLoginBtn = document.getElementById("client-login-btn");
      const loginError = document.getElementById("login-error");
      const welcomeText = document.getElementById("welcome-text");
      const logoutBtn = document.getElementById("logout-btn");

      const buyInput = document.getElementById("buy-price");
      const sellInput = document.getElementById("sell-price");
      const updateBtn = document.getElementById("main-btn");

      const settingsModal = document.getElementById("settings-modal");
      const openSettingsBtn = document.getElementById("open-settings");
      const closeSettingsBtn = document.getElementById("close-settings");
      const saveSettingsBtn = document.getElementById("save-settings");
      const buyMarginInput = document.getElementById("cfg-buy-margin");
      const sellSpreadInput = document.getElementById("cfg-sell-spread");
      const channelNameDisplay = document.getElementById("cfg-channel-name");

      const botActiveToggle = document.getElementById("bot-active-toggle");

      let authToken = localStorage.getItem("clientToken");

      // Parse token from URL if available
      const urlParams = new URLSearchParams(window.location.search);
      const urlToken = urlParams.get("token");
      if (urlToken) {
        authToken = urlToken;
        localStorage.setItem("clientToken", authToken);
      }

      function setLoading(active) {
        if (active) loadingOverlay.classList.remove("hidden");
        else loadingOverlay.classList.add("hidden");
      }

      function safeAlert(message, callback) {
        if (tg.isVersionAtLeast("6.2")) {
          tg.showAlert(message, callback);
        } else {
          alert(message);
          if (callback) callback();
        }
      }

      async function authFetch(path, options = {}) {
        if (!options.headers) options.headers = {};
        options.headers["Authorization"] = `Bearer ${authToken}`;
        const res = await fetch(`${API_BASE_URL}${path}`, options);
        if (res.status === 401) {
          logout();
          throw new Error("Unauthorized");
        }
        return res;
      }

      function logout() {
        authToken = null;
        localStorage.removeItem("clientToken");
        loginModal.classList.remove("hidden");
      }

      logoutBtn.addEventListener("click", logout);

      async function verifyAndLoad() {
        if (!authToken) {
          loginModal.classList.remove("hidden");
          return;
        }
        try {
          setLoading(true);
          const res = await authFetch("/api/client/config");
          const data = await res.json();
          if (data.success) {
            loginModal.classList.add("hidden");
            welcomeText.innerText = `Welcome, ${data.config.name}`;
            botActiveToggle.checked = data.config.botActive;
            buyMarginInput.value = data.config.buyMargin;
            sellSpreadInput.value = data.config.sellSpread;
            channelNameDisplay.innerText = data.config.chatTitle || "Unknown";
          } else {
            logout();
          }
        } catch (err) {
          logout();
        } finally {
          setLoading(false);
        }
      }

      clientLoginBtn.addEventListener("click", async () => {
        authToken = clientTokenInput.value.trim();
        if (authToken) {
          localStorage.setItem("clientToken", authToken);
          loginError.classList.add("hidden");
          await verifyAndLoad();
          if (!authToken) loginError.classList.remove("hidden");
        }
      });

      verifyAndLoad();

      // Settings Modal Logic
      openSettingsBtn.addEventListener("click", async () => {
        try {
          setLoading(true);
          const res = await authFetch("/api/client/config");
          const result = await res.json();
          if (result.success) {
            buyMarginInput.value = result.config.buyMargin;
            sellSpreadInput.value = result.config.sellSpread;
            channelNameDisplay.innerText = result.config.chatTitle || "Unknown";
            settingsModal.classList.remove("hidden");
          } else {
            safeAlert("Failed to load configuration.");
          }
        } catch (error) {
          safeAlert("Could not connect to server.");
        } finally {
          setLoading(false);
        }
      });

      botActiveToggle.addEventListener("change", async () => {
        try {
          setLoading(true);
          const res = await authFetch("/api/client/update-config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ botActive: botActiveToggle.checked }),
          });
          const result = await res.json();
          if (!result.success) {
            botActiveToggle.checked = !botActiveToggle.checked; // Revert
            safeAlert(result.message || "Failed to update bot status.");
          }
        } catch (error) {
          botActiveToggle.checked = !botActiveToggle.checked; // Revert
          safeAlert("Connection error.");
        } finally {
          setLoading(false);
        }
      });

      closeSettingsBtn.addEventListener("click", () => {
        settingsModal.classList.add("hidden");
      });

      saveSettingsBtn.addEventListener("click", async () => {
        const payload = {
          buyMargin: parseFloat(buyMarginInput.value),
          sellSpread: parseFloat(sellSpreadInput.value),
        };

        try {
          setLoading(true);
          const res = await authFetch("/api/client/update-config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const result = await res.json();
          if (result.success) {
            safeAlert("Configuration updated successfully!");
            settingsModal.classList.add("hidden");
          } else {
            safeAlert("Failed to update configuration.");
          }
        } catch (error) {
          safeAlert("Connection error during save.");
        } finally {
          setLoading(false);
        }
      });

      updateBtn.addEventListener("click", async () => {
        const buyPrice = buyInput.value;
        const sellPrice = sellInput.value;

        if (!buyPrice || !sellPrice) {
          safeAlert("Please enter both buy and sell prices.");
          return;
        }

        try {
          setLoading(true);
          updateBtn.disabled = true;
          const originalText = updateBtn.innerText;
          updateBtn.innerText = "Updating Prices...";

          const payload = {
            buy: parseFloat(buyPrice),
            sell: parseFloat(sellPrice),
          };

          const res = await authFetch("/api/client/send-message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const result = await res.json();
          if (result.success) {
            safeAlert("✅ Success: Prices updated successfully!", () => {
              tg.close();
            });
          } else {
            safeAlert(
              "❌ Error: " + (result.message || "Failed to update prices."),
            );
          }
          updateBtn.disabled = false;
          updateBtn.innerText = originalText;
        } catch (error) {
          safeAlert("❌ Connection Error: Could not reach the server.");
          updateBtn.disabled = false;
          updateBtn.innerText = "Update Prices";
        } finally {
          setLoading(false);
        }
      });

      function adjustInput(inputEl, delta) {
        const val = parseFloat(inputEl.value) || 0;
        const newVal = val + delta;
        if (newVal % 1 === 0) {
          inputEl.value = newVal.toString();
        } else {
          inputEl.value = newVal.toFixed(2);
        }
      }

      document.getElementById("both-minus-5").addEventListener("click", () => {
        adjustInput(sellInput, -5);
        adjustInput(buyInput, -5);
      });
      
      document.getElementById("both-plus-5").addEventListener("click", () => {
        adjustInput(sellInput, 5);
        adjustInput(buyInput, 5);
      });

      if (tg.themeParams.bg_color) {
        document.body.style.backgroundColor = tg.themeParams.bg_color;
      }
    </script>
  </body>
</html>
